name: CI
env:
   POSTGRESQL_HOST: localhost
   POSTGRESQL_PORT: 5432
   POSTGRESQL_USR: postgres
   POSTGRESQL_PWD: root123
   POSTGRESQL_DATABASE: registry
   DOCKER_COMPOSE_VERSION: 1.23.0
   PIP_BREAK_SYSTEM_PACKAGES: 1
   HARBOR_ADMIN: admin
   HARBOR_ADMIN_PASSWD: Harbor12345
   CORE_SECRET: tempString
   KEY_PATH: "/data/secret/keys/secretkey"
   REDIS_HOST: localhost
   REG_VERSION: v2.7.1-patch-2819-2553
   UI_BUILDER_VERSION: 1.6.0

on:
  pull_request:
  push:
    # PR branches run through pull_request only, so each push runs CI once.
    branches:
    - dce-v2.6.3
    paths-ignore:
    - 'docs/**'

jobs:
  UTTEST:
    env:
       UTTEST: true
    runs-on:
      #- self-hosted
      - ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
           cache: false
           go-version: 1.27.3
        id: go
      - uses: actions/checkout@v4
        with:
         path: src/github.com/goharbor/harbor
      - name: setup env
        run: |
          cd src/github.com/goharbor/harbor
          pwd
          go env
          echo "GOPATH=$(go env GOPATH):$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "TOKEN_PRIVATE_KEY_PATH=${GITHUB_WORKSPACE}/src/github.com/goharbor/harbor/tests/private_key.pem" >> $GITHUB_ENV
        shell: bash
      - name: before_install
        run: |
          set -x
          sudo apt-get update -qq && sudo apt-get install -y -qq python-is-python3 python3-pip
          cd src/github.com/goharbor/harbor
          pwd
          env
          #sudo apt install -y xvfb
          #xvfb-run ls
          # docker-compose 1.x speaks Docker API 1.22, which current Docker rejects; use the Compose v2 plugin.
          printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
          IP=`hostname -I | awk '{print $1}'`
          echo '{"insecure-registries" : ["'$IP':5000"]}' | sudo tee /etc/docker/daemon.json
          echo "IP=$IP" >> $GITHUB_ENV
          sudo cp ./tests/harbor_ca.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates
          sudo service docker restart
      - name: install
        run: |
          cd src/github.com/goharbor/harbor
          env
          df -h
          bash ./tests/showtime.sh ./tests/ci/ut_install.sh
      - name: script
        run: |
          echo IP: $IP
          df -h
          cd src/github.com/goharbor/harbor
          bash ./tests/showtime.sh ./tests/ci/ut_run.sh $IP
          df -h
      - name: Codecov For BackEnd
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./src/github.com/goharbor/harbor/profile.cov
          flags: unittests

  APITEST_DB:
    env:
      APITEST_DB: true
    runs-on:
      #- self-hosted
      - ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          cache: false
          go-version: 1.27.3
        id: go
      - uses: actions/checkout@v4
        with:
          path: src/github.com/goharbor/harbor
      - name: setup env
        run: |
          cd src/github.com/goharbor/harbor
          pwd
          go env
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          echo "GOPATH=$(go env GOPATH):$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "TOKEN_PRIVATE_KEY_PATH=${GITHUB_WORKSPACE}/src/github.com/goharbor/harbor/tests/private_key.pem" >> $GITHUB_ENV
          IP=`hostname -I | awk '{print $1}'`
          echo "IP=$IP" >> $GITHUB_ENV
        shell: bash
      - name: before_install
        run: |
          set -x
          sudo apt-get update -qq && sudo apt-get install -y -qq python-is-python3 python3-pip
          cd src/github.com/goharbor/harbor
          pwd
          env
          df -h
          #sudo apt install -y xvfb
          #xvfb-run ls
          # docker-compose 1.x speaks Docker API 1.22, which current Docker rejects; use the Compose v2 plugin.
          printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      - name: install
        run: |
          cd src/github.com/goharbor/harbor
          env
          df -h
          docker system prune -a -f
          bash ./tests/showtime.sh ./tests/ci/api_common_install.sh $IP DB
      - name: script
        run: |
          cd src/github.com/goharbor/harbor
          echo IP: $IP
          df -h
          bash ./tests/showtime.sh ./tests/ci/api_run.sh DB $IP
          df -h
      - name: collect logs
        if: always()
        run: |
          set +e
          cd src/github.com/goharbor/harbor
          out="$RUNNER_TEMP/ci-logs"; mkdir -p "$out/containers"
          sudo docker ps -a > "$out/docker-ps.txt"; cat "$out/docker-ps.txt"
          for c in $(sudo docker ps -a --format '{{.Names}}'); do sudo docker logs --tail 500 "$c" > "$out/containers/$c.log" 2>&1; done
          sudo cp -r /var/log/harbor "$out/var-log-harbor" 2>/dev/null
          cp output.xml log.html "$out/" 2>/dev/null
          sudo chown -R "$(id -u)" "$out"
          for f in core jobservice registryctl chartmuseum; do echo "===== $f"; tail -n 30 "$out/var-log-harbor/$f.log" 2>/dev/null; done
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/ci-logs
          retention-days: 7

  APITEST_LDAP:
    env:
      APITEST_LDAP: true
    runs-on:
      #- self-hosted
      - ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          cache: false
          go-version: 1.27.3
        id: go
      - uses: actions/checkout@v4
        with:
          path: src/github.com/goharbor/harbor
      - name: setup env
        run: |
          cd src/github.com/goharbor/harbor
          pwd
          go env
          echo "GOPATH=$(go env GOPATH):$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "TOKEN_PRIVATE_KEY_PATH=${GITHUB_WORKSPACE}/src/github.com/goharbor/harbor/tests/private_key.pem" >> $GITHUB_ENV
          IP=`hostname -I | awk '{print $1}'`
          echo "IP=$IP" >> $GITHUB_ENV
        shell: bash
      - name: before_install
        run: |
          set -x
          sudo apt-get update -qq && sudo apt-get install -y -qq python-is-python3 python3-pip
          cd src/github.com/goharbor/harbor
          pwd
          env
          df -h
          #sudo apt install -y xvfb
          #xvfb-run ls
          # docker-compose 1.x speaks Docker API 1.22, which current Docker rejects; use the Compose v2 plugin.
          printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      - name: install
        run: |
          cd src/github.com/goharbor/harbor
